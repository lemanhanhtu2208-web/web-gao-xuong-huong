<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Ảnh sản phẩm Gạo Xướng Hương">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8D9C0"/>
      <stop offset="1" stop-color="#F3EADD"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#8B5E34" opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <g transform="translate(400 268)" text-anchor="middle">
    <text font-size="120" font-family="serif">🌾</text>
  </g>
  <text x="400" y="360" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="36" font-weight="700" fill="#6B4226">GẠO XƯỚNG HƯƠNG</text>
  <text x="400" y="400" text-anchor="middle" font-family="'Be Vietnam Pro', sans-serif" font-size="20" fill="#8B5E34">Hình ảnh đang được cập nhật</text>
  <rect x="250" y="430" width="300" height="2" fill="#D9A441"/>
</svg>
